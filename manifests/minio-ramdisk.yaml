# MinIO with RAM-disk storage for low-latency benchmarking
# Uses tmpfs (memory-backed) storage instead of disk
# WARNING: Data is lost when pod restarts!
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: default
  labels:
    storage-type: ramdisk
spec:
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
        storage-type: ramdisk
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2023-09-30T07-02-29Z
        args:
        - server
        - /data
        - --console-address
        - ":9001"
        env:
        - name: MINIO_ROOT_USER
          value: faveadmin
        - name: MINIO_ROOT_PASSWORD
          value: favesecret
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "5Gi"   # 4Gi for data + 1Gi for MinIO process
            cpu: "1000m"
      volumes:
      - name: data
        emptyDir:
          medium: Memory    # RAM-disk (tmpfs)
          sizeLimit: 4Gi    # Maximum 4GB of RAM for storage
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: api
    - port: 9001
      targetPort: 9001
      protocol: TCP
      name: console
  selector:
    app: minio
